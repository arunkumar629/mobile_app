{% extends "base.html" %}
{% block title %}Add Procurement{% endblock %}{% block page_title %}Add Procurement Batch{% endblock %}
{% block content %}<div class="card"><form method="post" class="form-grid">
    <div class="form-group"><label for="device_type_id">Device *</label><select name="device_type_id" id="device_type_id" required><option value="">Select</option>{% for dt in device_types %}<option value="{{ dt.id }}">{{ dt.name }} (&#8377;{{ fmt_inr(dt.unit_cost) }})</option>{% endfor %}</select></div>
    <div class="form-group"><label for="batch_number">Batch #</label><input type="text" name="batch_number" id="batch_number"></div>
    <div class="form-group"><label for="quantity">Quantity *</label><input type="number" name="quantity" id="quantity" min="1" required></div>
    <div class="form-group"><label for="unit_cost">Unit Cost (&#8377;)</label><input type="number" name="unit_cost" id="unit_cost" min="0" step="0.01"></div>
    <div class="form-group"><label for="vendor">Vendor</label><input type="text" name="vendor" id="vendor"></div>
    <div class="form-group"><label for="procurement_date">Date</label><input type="date" name="procurement_date" id="procurement_date"></div>
    <div class="form-group form-full"><label for="notes">Notes</label><textarea name="notes" id="notes"></textarea></div>
    <div class="form-actions"><button type="submit" class="btn btn-primary">Add Batch</button><a href="{{ url_for('inventory_list') }}" class="btn btn-outline">Cancel</a></div>
</form></div>{% endblock %}
