{% extends "base.html" %}
{% block title %}{{ 'Edit' if beneficiary else 'Register' }} Beneficiary{% endblock %}{% block page_title %}{{ 'Edit' if beneficiary else 'Register New' }} Beneficiary{% endblock %}
{% block content %}<div class="card"><form method="post" class="form-grid">
    <div class="form-group"><label for="name">Beneficiary Name *</label><input type="text" name="name" id="name" value="{{ beneficiary.name if beneficiary else '' }}" required></div>
    <div class="form-group"><label for="age">Age</label><input type="number" name="age" id="age" min="1" max="120" value="{{ beneficiary.age if beneficiary and beneficiary.age else '' }}"></div>
    <div class="form-group"><label for="gender">Gender</label><select name="gender" id="gender"><option value="">Select</option>{% for g in ['Male','Female','Other'] %}<option value="{{ g }}" {% if beneficiary and beneficiary.gender == g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></div>
    <div class="form-group"><label for="visual_acuity">Visual Acuity / Disability %</label><input type="text" name="visual_acuity" id="visual_acuity" value="{{ beneficiary.visual_acuity if beneficiary else '' }}" placeholder="e.g., 6/60, 80% disability"></div>
    <div class="form-group"><label for="vision_category">Vision Category (Blind/LV)</label><select name="vision_category" id="vision_category">{% for c in ['Low Vision','Blind','CVI','Other'] %}<option value="{{ c }}" {% if beneficiary and beneficiary.vision_category == c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div>
    <div class="form-group"><label for="disability_certificate">Govt Disability Certificate</label><select name="disability_certificate" id="disability_certificate">{% for v in ['Y','N'] %}<option value="{{ v }}" {% if beneficiary and beneficiary.disability_certificate == v %}selected{% endif %}>{{ v }}</option>{% endfor %}</select></div>
    <div class="form-group"><label for="partner_id">Partner Hospital / School</label><select name="partner_id" id="partner_id"><option value="">None</option>{% for p in partners %}<option value="{{ p.id }}" {% if beneficiary and beneficiary.partner_id == p.id %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></div>
    <div class="form-group"><label for="employment_status">Employment Status</label><select name="employment_status" id="employment_status">{% for s in ['Student','Employed','Unemployed','Job Seeker','Homemaker','Senior Citizen'] %}<option value="{{ s }}" {% if beneficiary and beneficiary.employment_status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div>
    <div class="form-group"><label for="class_or_year">Class / Year of College</label><input type="text" name="class_or_year" id="class_or_year" value="{{ beneficiary.class_or_year if beneficiary else '' }}" placeholder="If student"></div>
    <div class="form-group"><label for="education_qualification">Educational Qualification</label><input type="text" name="education_qualification" id="education_qualification" value="{{ beneficiary.education_qualification if beneficiary else '' }}"></div>
    <div class="form-group"><label for="aadhar_no">Aadhar No.</label><input type="text" name="aadhar_no" id="aadhar_no" value="{{ beneficiary.aadhar_no if beneficiary else '' }}" maxlength="12"></div>
    <div class="form-group"><label for="location">Village / Town / District</label><input type="text" name="location" id="location" value="{{ beneficiary.location if beneficiary else '' }}"></div>
    <div class="form-group"><label for="city">City</label><input type="text" name="city" id="city" value="{{ beneficiary.city if beneficiary else '' }}"></div>
    <div class="form-group"><label for="state">State</label><input type="text" name="state" id="state" value="{{ beneficiary.state if beneficiary else '' }}"></div>
    <div class="form-group"><label for="phone">Mobile Phone No.</label><input type="tel" name="phone" id="phone" value="{{ beneficiary.phone if beneficiary else '' }}"></div>
    <div class="form-group"><label for="email">Email</label><input type="email" name="email" id="email" value="{{ beneficiary.email if beneficiary else '' }}"></div>
    <div class="form-group"><label for="smartphone_model">Smartphone Model</label><input type="text" name="smartphone_model" id="smartphone_model" value="{{ beneficiary.smartphone_model if beneficiary else '' }}"></div>
    <div class="form-group"><label for="port_type">Port Type</label><select name="port_type" id="port_type"><option value="">Select</option>{% for p in ['Type C','Type B','Micro USB','Lightning'] %}<option value="{{ p }}" {% if beneficiary and beneficiary.port_type == p %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></div>
    <div class="form-group"><label for="financial_status">Financial Status</label><select name="financial_status" id="financial_status"><option value="">Select</option>{% for f in ['BPL','APL','Middle Income','Unknown'] %}<option value="{{ f }}" {% if beneficiary and beneficiary.financial_status == f %}selected{% endif %}>{{ f }}</option>{% endfor %}</select></div>
    <div class="form-group form-full"><label for="notes">Notes</label><textarea name="notes" id="notes">{{ beneficiary.notes if beneficiary else '' }}</textarea></div>
    <div class="form-actions"><button type="submit" class="btn btn-primary">{{ 'Update' if beneficiary else 'Register' }} Beneficiary</button><a href="{{ url_for('beneficiary_list') }}" class="btn btn-outline">Cancel</a></div>
</form></div>{% endblock %}
