<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SATHI 2026</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <h1 class="login-title">SATHI 2026</h1>
            <p class="login-subtitle">Vision-Aid Program Management</p>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}{% for cat, msg in messages %}
            <div class="alert alert-{{ cat }}">{{ msg }}</div>
            {% endfor %}{% endif %}{% endwith %}
            <form method="post">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" required autofocus placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Log In</button>
            </form>
        </div>
    </div>
</body>
</html>
